# SkillTrace Taxonomy Rules (skills.yaml)
# Defines skills, aliases, categories, and multi-tier evidence detection patterns
# Adheres to SRS Section 8.2 and Section 9.2

skills:
  - skill_id: "sql"
    name: "SQL"
    category: "Databases & Storage"
    aliases:
      - "SQL"
      - "Structured Query Language"
      - "RDBMS"
      - "Relational Database"
      - "MySQL"
      - "PostgreSQL"
      - "SQLite"
      - "Database Queries"
    strong_patterns:
      file_extensions: [".sql"]
      code_regex:
        - "(?i)(SELECT\\s+.*\\s+FROM\\s+\\w+)"
        - "(?i)(INSERT\\s+INTO\\s+\\w+)"
        - "(?i)(UPDATE\\s+\\w+\\s+SET)"
        - "(?i)(DELETE\\s+FROM\\s+\\w+)"
        - "(?i)(CREATE\\s+TABLE\\s+\\w+)"
        - "(?i)(ALTER\\s+TABLE\\s+\\w+)"
        - "(?i)(cursor\\.execute\\s*\\([\"'].*[\"']\\))"
        - "(?i)(db\\.execute\\s*\\([\"'].*[\"']\\))"
        - "(?i)(session\\.execute\\s*\\([\"'].*[\"']\\))"
    corroborating_patterns:
      manifest_dependencies:
        - "sqlite3"
        - "psycopg2"
        - "psycopg2-binary"
        - "asyncpg"
        - "sqlalchemy"
        - "mysqlclient"
        - "aiosqlite"
        - "alembic"
        - "pg"
        - "mysql2"
      file_patterns:
        - "alembic/versions/*"
        - "migrations/*"
        - "tests/test_*db*.py"
        - "tests/test_*sql*.py"
    weak_patterns:
      readme_keywords:
        - "sql"
        - "database"
        - "queries"
        - "relational"

  - skill_id: "python"
    name: "Python"
    category: "Programming Languages"
    aliases:
      - "Python"
      - "Python3"
      - "Python 3"
      - "CPython"
      - "Py"
    strong_patterns:
      file_extensions: [".py"]
      code_regex:
        - "(def\\s+[a-zA-Z_][a-zA-Z0-9_]*\\s*\\(.*?\\):)"
        - "(class\\s+[a-zA-Z_][a-zA-Z0-9_]*(?:\\(.*?\\))?:)"
        - "(if\\s+__name__\\s*==\\s*[\"']__main__[\"']:)"
        - "(import\\s+[a-zA-Z_][a-zA-Z0-9_]*)"
        - "(from\\s+[a-zA-Z_][a-zA-Z0-9_]*\\s+import)"
    corroborating_patterns:
      manifest_dependencies:
        - "python"
      file_patterns:
        - "setup.py"
        - "pyproject.toml"
        - "Pipfile"
        - "requirements.txt"
        - ".python-version"
        - "tox.ini"
    weak_patterns:
      readme_keywords:
        - "python"
        - "pythonic"
        - "pip"

  - skill_id: "docker"
