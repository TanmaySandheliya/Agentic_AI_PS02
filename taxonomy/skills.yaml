    category: "DevOps & Containers"
    aliases:
      - "Docker"
      - "Containerization"
      - "Docker Container"
      - "Dockerfile"
      - "Docker Compose"
    strong_patterns:
      file_names:
        - "Dockerfile"
        - "docker-compose.yml"
        - "docker-compose.yaml"
        - "compose.yml"
        - "compose.yaml"
        - "Dockerfile.dev"
        - "Dockerfile.prod"
      code_regex:
        - "(?i)(FROM\\s+[a-zA-Z0-9_./:-]+(\\s+AS\\s+\\w+)?)"
        - "(?i)(RUN\\s+.+)"
        - "(?i)(ENTRYPOINT\\s+\\[.*\\])"
        - "(?i)(CMD\\s+\\[.*\\])"
        - "(services:\\s*\\n\\s+[a-zA-Z0-9_-]+:)"
    corroborating_patterns:
      file_patterns:
        - ".dockerignore"
        - ".github/workflows/*docker*.yml"
      manifest_dependencies:
